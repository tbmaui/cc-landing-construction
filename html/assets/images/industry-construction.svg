<!-- Modern Tower Crane (right side: x=300 to 455) -->
<g stroke="#466359" stroke-width="2.2">
  <!-- Vertical mast tower with geometric cross lattice -->
  <path d="M382 375V75M404 375V75M382 75h22"/>
  <g stroke="#6A9082" stroke-width="1.6">
    <path d="M382 95l22 18M404 113l-22 18M382 131l22 18M404 149l-22 18M382 167l22 18M404 185l-22 18M382 203l22 18M404 221l-22 18M382 239l22 18M404 257l-22 18M382 275l22 18M404 293l-22 18M382 311l22 18M404 329l-22 18M382 347l22 18"/>
  </g>
  <!-- Horizontal Crane Jib & Counter-jib -->
  <path d="M255 75h195M255 90h195M255 75v15M450 75v15"/>
  <!-- Crane Tower Top & Stay Cables -->
  <path d="M393 42l-138 33M393 42l57 33M393 42v33" stroke="#6A9082" stroke-width="2.0"/>
  <!-- Operator cab -->
  <rect x="370" y="80" width="12" height="18" fill="#F0F4F2" stroke="#466359" stroke-width="1.8"/>
  
  <!-- Trolley and hoist cable -->
  <rect x="298" y="90" width="16" height="8" fill="#FFFFFF" stroke="#466359" stroke-width="2"/>
  <line x1="306" y1="98" x2="306" y2="152" stroke="#6A9082" stroke-width="1.8"/>
  <!-- Hook with orange accent -->
  <path d="M306 152v6a5 5 0 0 1-5 5h-2" stroke="#F36334" stroke-width="2.4"/>
  
  <!-- Suspended Steel I-Beam -->
  <g transform="translate(265, 163)">
    <!-- Top flange -->
    <path d="M0 0h82v4H0z" fill="#466359" stroke="#466359" stroke-width="1.5"/>
    <!-- Web -->
    <path d="M38 4h6v12h-6z" fill="#F36334" stroke="#F36334" stroke-width="1"/>
    <!-- Bottom flange -->
    <path d="M0 16h82v4H0z" fill="#466359" stroke="#466359" stroke-width="1.5"/>
  </g>
</g>

