<!-- Right: Contractor Hard Hat & Precision Spirit Level (x=275 to 445) -->
<!-- Generous 50px space from the blueprint! -->
<g stroke="#466359" stroke-linecap="round" stroke-linejoin="round">
  <!-- Modern Safety Hard Hat (Upper Right) -->
  <g transform="translate(285, 80)">
    <!-- Crown Dome -->
    <path d="M15 85c0-48 35-75 75-75s75 27 75 75" fill="#FFFFFF" stroke="#466359" stroke-width="2.6"/>
    <!-- Center reinforcement ridges -->
    <path d="M90 10v75M70 18v67M110 18v67" stroke="#6A9082" stroke-width="1.8"/>
    <!-- Safety reflex orange stripe -->
    <path d="M22 68h136v10H22z" fill="#F36334" stroke="#F36334" stroke-width="1.2"/>
    <!-- Protective visor / brim -->
    <path d="M5 85h170v14H5z" fill="#F0F4F2" stroke="#466359" stroke-width="2.4"/>
    <!-- Ear protector / chin strap mount -->
    <circle cx="90" cy="85" r="4.5" fill="#466359"/>
